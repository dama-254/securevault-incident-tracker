services:
  - type: web
    name: securevault-incident-tracker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:10000
    envVars:
      - key: SECRET_KEY
        value: securevault-production-secret-2026
      - key: PYTHON_VERSION
        value: 3.12.3

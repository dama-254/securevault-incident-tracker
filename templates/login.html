<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecureVault — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:20px;">
        <div style="font-size:40px;">🔐</div>
        <h1 style="font-size:24px;margin-top:8px;">SecureVault</h1>
        <p class="subtitle">Personal Cybersecurity Incident Tracker</p>
      </div>
      <h2 id="formTitle" style="font-size:18px;margin-bottom:6px;">Welcome back</h2>
      <p class="subtitle" id="formSubtitle">Sign in to track your security incidents</p>
      <form id="authForm" style="margin-top:20px;">
        <div class="field">
          <label>Username</label>
          <input type="text" id="username" placeholder="e.g. damaris" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Log In</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
      <div class="toggle-link">
        <span id="toggleText">
          Don't have an account?
          <span id="toggleLink" style="color:var(--cyan);cursor:pointer;font-weight:600;">Register</span>
        </span>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
